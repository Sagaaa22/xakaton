<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Grand Mobile Support Copilot — Админ-панель</title>
<style>
:root{
  /* Wix Community Forum (Template 1949 / Random Musings) Aesthetics */
  --bg:#0a0218;
  --bg-subtle:#100326;
  --surface:#14052f;
  --surface-hover:#1e0843;
  --card:#1a073a;
  --card2:#240b4f;
  --card-hover:#2d0e60;
  --hover:#2f0f63;
  --border:#3a1470;
  --border-subtle:#260a4e;
  --border-focus:#ec4899;

  /* Typography */
  --text:#ffffff;
  --text2:#e2d9f3;
  --muted:#a694c7;
  --muted-light:#c4b5fd;

  /* Accents - Signature Neon Fuchsia / Pink & Royal Violet from Wix 1949 */
  --accent:#ec4899;
  --accent-hover:#f43f5e;
  --accent-soft:rgba(236,72,153,0.18);
  --accent-gradient:linear-gradient(135deg,#ec4899 0%,#8b5cf6 100%);
  --accent-glow:0 0 22px rgba(236,72,153,0.45);
  --purple:#8b5cf6;
  --purple-soft:rgba(139,92,246,0.18);
  --purple-glow:0 0 20px rgba(139,92,246,0.35);

  /* Status Badges */
  --ok:#10b981;
  --ok-bg:rgba(16,185,129,0.15);
  --ok-border:rgba(16,185,129,0.42);

  --warn:#f59e0b;
  --warn-bg:rgba(245,158,11,0.16);
  --warn-border:rgba(245,158,11,0.45);

  --bad:#f43f5e;
  --bad-bg:rgba(244,63,94,0.16);
  --bad-border:rgba(244,63,94,0.45);

  --crit:#ec4899;
  --crit-bg:rgba(236,72,153,0.2);
  --crit-border:rgba(236,72,153,0.55);

  --info:#06b6d4;
  --info-bg:rgba(6,182,212,0.16);
  --info-border:rgba(6,182,212,0.42);

  /* Dimensions & Shadows */
  --radius-sm:8px;
  --radius:14px;
  --radius-lg:20px;
  --radius-full:9999px;
  --focus:0 0 0 3px rgba(236,72,153,0.45);
  --shadow-sm:0 2px 5px rgba(0,0,0,0.35);
  --shadow:0 8px 24px rgba(0,0,0,0.5);
  --shadow-lg:0 20px 48px rgba(0,0,0,0.7);
}

*{box-sizing:border-box;margin:0;padding:0}
html{font-size:14.5px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Inter",sans-serif;
  background:radial-gradient(ellipse at 80% 0%,#2b0654 0%,var(--bg) 60%);
  background-attachment:fixed;
  color:var(--text);
  line-height:1.55;
  min-height:100vh;
  overflow-x:hidden;
}
a{color:#f472b6;text-decoration:none;transition:all .15s ease}
a:hover{color:#fbcfe8;text-decoration:none;text-shadow:0 0 8px rgba(244,114,182,0.5)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:var(--radius-sm)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Layout Grid */
.app{display:grid;grid-template-columns:260px 1fr;grid-template-rows:auto auto 1fr;min-height:100vh;position:relative}
.topbar{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:12px 24px;background:#05000c;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40;box-shadow:0 4px 20px rgba(0,0,0,0.6)}
.demo-strip{grid-column:1/3;background:linear-gradient(90deg,rgba(236,72,153,0.15) 0%,rgba(139,92,246,0.15) 100%);border-bottom:1px solid rgba(236,72,153,0.35);color:#fbcfe8;font-size:0.83rem;padding:6px 24px;display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:12px;font-weight:700}
.logo{width:38px;height:38px;border-radius:10px;background:var(--accent-gradient);display:grid;place-items:center;font-weight:900;color:#fff;box-shadow:var(--accent-glow);letter-spacing:1px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:0.75rem;margin-top:2px}
.topbar .spacer{flex:1}
.userbox{display:flex;align-items:center;gap:10px;font-size:0.85rem;color:var(--text2);background:var(--surface);padding:4px 12px;border-radius:var(--radius-full);border:1px solid var(--border)}
.sidebar{background:#0a0118;border-right:1px solid var(--border);padding:18px 12px;display:flex;flex-direction:column;gap:3px}
.nav-link{display:flex;align-items:center;gap:11px;padding:10px 14px;border-radius:var(--radius-full);color:var(--text2);font-size:0.88rem;font-weight:500;transition:all .18s cubic-bezier(0.16,1,0.3,1)}
.nav-link:hover{background:rgba(139,92,246,0.16);color:#fff;transform:translateX(3px)}
.nav-link.active{background:linear-gradient(90deg,rgba(236,72,153,0.25) 0%,rgba(139,92,246,0.15) 100%);color:#fff;box-shadow:inset 3px 0 0 var(--accent);font-weight:600}
.nav-link .count{margin-left:auto;background:var(--card2);border-radius:999px;padding:2px 9px;font-size:0.72rem;color:var(--text2);font-weight:600}
.nav-link .count.hot{background:linear-gradient(135deg,#ec4899,#f43f5e);color:#fff;box-shadow:0 0 10px rgba(236,72,153,0.5)}
.nav-link .lock{margin-left:auto;font-size:0.72rem;color:var(--muted)}
.nav-sep{height:1px;background:var(--border-subtle);margin:10px 8px}
.main{padding:24px 28px;min-width:0;overflow:auto}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.page-head h1{font-size:1.55rem;font-weight:800;letter-spacing:-0.02em;color:#fff}
.page-head p{color:var(--text2);font-size:0.9rem;max-width:80ch;margin-top:4px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Wix Community Forum Hero Banner */
.forum-hero{
  background:radial-gradient(ellipse at 85% 20%,#4a044e 0%,#200542 50%,#0c021b 100%);
  border:1px solid #4a157d;
  border-radius:var(--radius-lg);
  padding:24px 28px;
  margin-bottom:20px;
  position:relative;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(139,92,246,0.18);
}
.forum-hero::after{
  content:'';
  position:absolute;
  top:-60px;right:-60px;
  width:220px;height:220px;
  background:radial-gradient(circle,rgba(236,72,153,0.35) 0%,transparent 70%);
  pointer-events:none;
}
.forum-hero-tag{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(236,72,153,0.2);border:1px solid rgba(236,72,153,0.5);
  color:#fbcfe8;font-size:0.76rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;
  padding:3px 12px;border-radius:var(--radius-full);margin-bottom:10px;
}
.forum-hero-title{font-size:1.75rem;font-weight:900;letter-spacing:-0.02em;color:#ffffff;margin-bottom:6px;text-shadow:0 2px 12px rgba(0,0,0,0.6)}
.forum-hero-sub{color:#c4b5fd;font-size:0.95rem;max-width:75ch;margin-bottom:16px;line-height:1.55}
.forum-hero-actions{display:flex;flex-wrap:wrap;gap:10px}

/* Pill Buttons matching Wix Community Forum */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:38px;padding:0 18px;border-radius:var(--radius-full);
  border:1px solid var(--border);background:var(--card);color:var(--text);
  font-size:0.86rem;font-weight:600;cursor:pointer;white-space:nowrap;
  transition:all .18s cubic-bezier(0.16,1,0.3,1);
  user-select:none;text-decoration:none;box-shadow:var(--shadow-sm);
}
.btn:hover:not(:disabled){
  background:var(--hover);border-color:#5d25a8;transform:translateY(-2px);
  box-shadow:0 6px 18px rgba(139,92,246,0.3);color:#ffffff;text-decoration:none;
}
.btn:active:not(:disabled){transform:translateY(0)}
.btn:disabled{opacity:0.45;cursor:not-allowed;transform:none}
.btn.primary{
  background:var(--accent-gradient);border-color:transparent;color:#ffffff;
  box-shadow:0 4px 16px rgba(236,72,153,0.45);
}
.btn.primary:hover:not(:disabled){
  background:linear-gradient(135deg,#f43f5e 0%,#9333ea 100%);
  box-shadow:0 6px 24px rgba(236,72,153,0.65);
}
.btn.ok{background:var(--ok-bg);border-color:var(--ok-border);color:#6ee7b7}
.btn.ok:hover:not(:disabled){background:rgba(16,185,129,0.25);border-color:rgba(16,185,129,0.6);box-shadow:0 4px 14px rgba(16,185,129,0.35)}
.btn.danger{background:var(--bad-bg);border-color:var(--bad-border);color:#fca5a5}
.btn.danger:hover:not(:disabled){background:rgba(244,63,94,0.25);border-color:rgba(244,63,94,0.6);box-shadow:0 4px 14px rgba(244,63,94,0.35)}
.btn.warn{background:var(--warn-bg);border-color:var(--warn-border);color:#fcd34d}
.btn.warn:hover:not(:disabled){background:rgba(245,158,11,0.25);border-color:rgba(245,158,11,0.6);box-shadow:0 4px 14px rgba(245,158,11,0.35)}
.btn.sm{height:30px;padding:0 12px;font-size:0.79rem;gap:5px}

/* Form Controls */
.input,.select,.textarea{
  background:var(--bg-subtle);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:8px 13px;font-size:0.87rem;color:var(--text);min-width:0;
  transition:all .18s ease;
}
.input:hover,.select:hover,.textarea:hover{border-color:#5a23a3}
.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);outline:none;box-shadow:var(--focus)}
.textarea{width:100%;resize:vertical;line-height:1.55}
.filters{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:16px;align-items:center}
.filters .input{flex:1 1 210px}

/* Badges with Glowing Accents */
.b{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:var(--radius-full);font-size:0.75rem;font-weight:700;border:1px solid transparent;white-space:nowrap;line-height:1.35}
.p-critical{background:var(--crit-bg);color:#fbcfe8;border-color:var(--crit-border);box-shadow:0 0 10px rgba(236,72,153,0.3)}
.p-high{background:var(--bad-bg);color:#fecaca;border-color:var(--bad-border)}
.p-medium{background:var(--warn-bg);color:#fef3c7;border-color:var(--warn-border)}
.p-low{background:var(--ok-bg);color:#d1fae5;border-color:var(--ok-border)}
.s-new{background:rgba(59,130,246,0.18);color:#bfdbfe;border-color:rgba(59,130,246,0.45)}
.s-in_progress{background:rgba(139,92,246,0.22);color:#e9d5ff;border-color:rgba(139,92,246,0.45)}
.s-awaiting_player{background:rgba(148,163,184,0.18);color:#cbd5e1;border-color:rgba(148,163,184,0.38)}
.s-escalated{background:rgba(244,63,94,0.22);color:#ffe4e6;border-color:rgba(244,63,94,0.5)}
.s-returned{background:rgba(245,158,11,0.22);color:#fef3c7;border-color:rgba(245,158,11,0.45)}
.s-resolved{background:rgba(16,185,129,0.2);color:#d1fae5;border-color:rgba(16,185,129,0.45)}
.s-closed{background:rgba(100,116,139,0.25);color:#cbd5e1;border-color:rgba(100,116,139,0.4)}
.b-lang{background:rgba(59,130,246,0.16);color:#bfdbfe;text-transform:uppercase;border-color:rgba(59,130,246,0.35)}
.b-cat{background:rgba(236,72,153,0.16);color:#fbcfe8;border-color:rgba(236,72,153,0.4)}
.b-subcat{background:rgba(139,92,246,0.18);color:#e9d5ff;border-color:rgba(139,92,246,0.4)}
.b-human{background:var(--bad-bg);color:#ffe4e6;border-color:var(--bad-border)}
.b-auto{background:var(--ok-bg);color:#d1fae5;border-color:var(--ok-border)}
.b-muted{background:var(--card2);color:var(--text2);border-color:var(--border)}

/* Cards & Surfaces */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 22px;box-shadow:var(--shadow);transition:border-color .18s ease}
.card:hover{border-color:#531d93}
.card h2,.card h3{font-size:0.83rem;text-transform:uppercase;letter-spacing:0.07em;font-weight:700;color:var(--text2);margin-bottom:14px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:14px;margin-bottom:20px}
.stat{background:linear-gradient(180deg,var(--card) 0%,var(--surface) 100%);border:1px solid var(--border);border-radius:var(--radius);padding:15px 18px;cursor:default;transition:all .18s ease}
.stat:hover{border-color:#6d28d9;transform:translateY(-2px);box-shadow:0 8px 24px rgba(139,92,246,0.22)}
.stat a{display:block;color:inherit}
.stat .v{font-size:1.85rem;font-weight:800;color:#ffffff;line-height:1.2}
.stat .l{color:var(--text2);font-size:0.8rem;margin-top:5px;font-weight:500}
.stat.hot{border-color:rgba(236,72,153,0.5);background:linear-gradient(180deg,rgba(236,72,153,0.08),transparent)}
.stat.ok{border-color:rgba(16,185,129,0.45);background:linear-gradient(180deg,rgba(16,185,129,0.06),transparent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.stack{display:flex;flex-direction:column;gap:15px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px}
.kv div{background:var(--bg-subtle);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 13px}
.kv span{display:block;font-size:0.73rem;color:var(--muted);margin-bottom:3px}
.kv b{font-size:0.88rem;font-weight:600;word-break:break-word;color:#ffffff}
.muted{color:var(--muted)}
.small{font-size:0.83rem}

/* Confidence Bar */
.conf-wrap{background:var(--bg-subtle);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px}
.conf-track{height:9px;background:var(--card2);border-radius:999px;overflow:hidden;margin-top:6px}
.conf-fill{height:100%;border-radius:999px;transition:width .35s ease}

/* Split View */
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(400px,1fr);gap:18px;align-items:start}
.detail{position:sticky;top:72px;max-height:calc(100vh - 92px);overflow-y:auto;padding-right:3px}

/* Tables */
.table-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow-x:auto;-webkit-overflow-scrolling:touch;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:0.86rem}
caption{text-align:left;padding:12px 16px;color:var(--text2);font-size:0.79rem;text-transform:uppercase;letter-spacing:0.06em;font-weight:700}
th{position:sticky;top:0;background:#100224;text-align:left;font-weight:700;color:#c4b5fd;padding:0;border-bottom:1px solid var(--border);white-space:nowrap;z-index:2}
th button{background:none;border:0;padding:11px 14px;width:100%;text-align:left;cursor:pointer;color:inherit;font-weight:700;font-size:0.76rem;text-transform:uppercase;letter-spacing:0.05em;display:flex;align-items:center;justify-content:space-between}
th button:hover{background:var(--hover);color:#fff}
th span.th{display:block;padding:11px 14px;font-size:0.76rem;text-transform:uppercase;letter-spacing:0.05em}
td{padding:10px 14px;border-bottom:1px solid rgba(58,20,112,0.6);vertical-align:top}
tbody tr{cursor:pointer;transition:background-color .14s ease}
tbody tr:hover{background:rgba(139,92,246,0.12)}
tbody tr.sel{background:rgba(236,72,153,0.18);box-shadow:inset 3px 0 0 var(--accent)}
td.id{font-family:monospace;color:#fbcfe8;white-space:nowrap;font-size:0.84rem;font-weight:600}
.snip{color:var(--muted);font-size:0.79rem;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;max-width:320px;margin-top:2px}

/* Ticket Details */
.t-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.t-head h2{font-size:1.18rem;font-family:monospace;margin-right:6px;text-transform:none;color:#ffffff;font-weight:800}
.banner{border-radius:var(--radius);padding:12px 18px;font-size:0.87rem;line-height:1.55}
.banner.human{background:var(--bad-bg);border:1px solid var(--bad-border);color:#ffe4e6}
.banner.auto{background:var(--ok-bg);border:1px solid var(--ok-border);color:#d1fae5}
.banner.info{background:var(--info-bg);border:1px solid var(--info-border);color:#e0f2fe}
.banner.warn{background:var(--warn-bg);border:1px solid var(--warn-border);color:#fef3c7}
.banner b{display:block;margin-bottom:4px;font-weight:700}
.msg{background:var(--bg-subtle);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 15px}
.msg.admin{border-left:3px solid var(--accent)}
.msg .meta{display:flex;justify-content:space-between;font-size:0.76rem;color:var(--muted);margin-bottom:6px}
.msg .tx{white-space:pre-wrap;font-size:0.89rem;line-height:1.55}
.rule{background:var(--bg-subtle);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--radius-sm);padding:12px 15px}
.rule .rh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.rule .rid{background:var(--accent);color:#fff;font-weight:800;font-size:0.76rem;padding:2px 9px;border-radius:var(--radius-full);box-shadow:0 0 10px rgba(236,72,153,0.4)}
.rule q{display:block;font-style:italic;color:var(--text2);font-size:0.85rem;margin:6px 0;quotes:"«" "»"}
.rule .pun{font-size:0.79rem;color:#fcd34d;font-weight:600}
.ver-ok{color:#6ee7b7;font-size:0.79rem;font-weight:700}
.ver-bad{color:#fca5a5;font-size:0.79rem;font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:9px}
.timeline{list-style:none;display:flex;flex-direction:column;gap:8px;font-size:0.84rem}
.timeline li{border-left:2px solid var(--border);padding:3px 0 3px 14px}
.timeline .when{color:var(--muted);font-size:0.76rem}
details summary{cursor:pointer;color:var(--text2);font-size:0.87rem;font-weight:600}
ul.reasons{padding-left:18px;font-size:0.84rem;color:var(--text2);display:flex;flex-direction:column;gap:4px;margin-top:7px}

/* Telegram Cards */
.tg-msg{background:#160934;border:1px solid #3c196b;border-radius:var(--radius);padding:15px 18px;font-size:0.87rem;line-height:1.5;box-shadow:var(--shadow)}
.tg-msg pre{white-space:pre-wrap;font-family:inherit}
.tg-kb{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.tg-btn{background:linear-gradient(135deg,#2f125a 0%,#200840 100%);border:1px solid #4a1f88;color:#fff;padding:9px 14px;border-radius:var(--radius-full);font-size:0.83rem;font-weight:600;cursor:pointer;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all .18s}
.tg-btn:hover:not(:disabled){background:linear-gradient(135deg,#441a80 0%,#310d61 100%);border-color:#6d28d9;box-shadow:0 4px 14px rgba(109,40,217,0.3)}
.tg-btn:disabled{opacity:0.5;cursor:default}

/* Empty State & Error Boxes */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px;color:var(--text2)}
.empty-state .empty-icon{width:50px;height:50px;border-radius:50%;background:var(--card2);display:grid;place-items:center;margin-bottom:14px;color:var(--accent);box-shadow:0 0 16px rgba(236,72,153,0.3)}
.empty-state .empty-icon svg{width:26px;height:26px}
.empty-state h3{font-size:1.05rem;font-weight:700;color:#ffffff;margin-bottom:6px;text-transform:none;letter-spacing:normal}
.empty-state p{font-size:0.86rem;color:var(--muted);max-width:52ch}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:0.89rem}
.err{padding:15px 18px;border-radius:var(--radius-sm);background:var(--bad-bg);border:1px solid var(--bad-border);color:#ffe4e6;font-size:0.89rem;display:flex;align-items:center;gap:10px}

/* Spinner & Shimmer Skeletons */
.spinner{width:22px;height:22px;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.skel{
  height:14px;border-radius:6px;
  background:linear-gradient(90deg,var(--card2) 0%,var(--hover) 50%,var(--card2) 100%);
  background-size:200% 100%;
  animation:skShimmer 1.4s cubic-bezier(0.4,0,0.6,1) infinite;
  margin:6px 0;
}
@keyframes skShimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skeleton-card{padding:22px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius)}

/* Bar Charts */
.bar-row{display:grid;grid-template-columns:190px 1fr 48px;gap:10px;align-items:center;font-size:0.83rem;margin:6px 0}
.bar-row .tr{height:8px;background:var(--bg-subtle);border-radius:999px;overflow:hidden}
.bar-row .fl{height:100%;background:var(--accent-gradient)}
.bar-row .nm{color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Modals & Toasts */
.modal-bg{position:fixed;inset:0;background:rgba(8,1,18,0.85);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;z-index:90;padding:16px;animation:fadeIn 0.18s ease-out}
.modal-bg.open{display:flex}
.modal{background:#15052f;border:1px solid #4a157d;border-radius:var(--radius-lg);width:100%;max-width:620px;max-height:90vh;overflow-y:auto;padding:24px 26px;box-shadow:var(--shadow-lg);animation:modalScale 0.22s cubic-bezier(0.16,1,0.3,1)}
.modal h3{font-size:1.15rem;font-weight:800;color:#ffffff;margin-bottom:16px}
.field{margin-bottom:15px}
.field label{display:block;font-size:0.82rem;color:var(--text2);margin-bottom:6px;font-weight:600}
.field .input,.field .select{width:100%}
.check{display:flex;gap:10px;align-items:flex-start;font-size:0.87rem;margin:8px 0;cursor:pointer}
.check input{margin-top:3px}
.toasts{position:fixed;right:24px;bottom:24px;display:flex;flex-direction:column;gap:10px;z-index:100;pointer-events:none}
.toast{
  pointer-events:auto;display:flex;align-items:center;gap:11px;
  background:#1c073a;border:1px solid #4a157d;border-radius:var(--radius-sm);
  padding:12px 16px;font-size:0.87rem;color:#ffffff;max-width:440px;
  box-shadow:var(--shadow-lg);border-left:4px solid var(--accent);
  animation:toastEnter 0.24s cubic-bezier(0.16,1,0.3,1);
}
.toast.ok{border-left-color:var(--ok)}
.toast.error{border-left-color:var(--bad)}
.toast.warn{border-left-color:var(--warn)}
.toast-icon{flex:none;display:flex;align-items:center;justify-content:center}
.toast.ok .toast-icon{color:var(--ok)}
.toast.error .toast-icon{color:var(--bad)}
.toast.warn .toast-icon{color:var(--warn)}
.toast-text{flex:1;word-break:break-word}
.toast.toast-exit{opacity:0;transform:translateX(20px);transition:all 0.25s ease}
@keyframes toastEnter{from{opacity:0;transform:translateY(14px) scale(0.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes modalScale{from{opacity:0;transform:scale(0.95) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:var(--radius-full);border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:0.86rem;font-weight:600;transition:all .18s}
.tab:hover{background:var(--hover);border-color:#5a219e}
.tab[aria-selected="true"]{background:var(--accent-gradient);border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(236,72,153,0.38)}

/* ==================== Responsive Breakpoints ==================== */
@media (max-width:1180px){
  .split{grid-template-columns:1fr;gap:18px}
  .detail{position:static;max-height:none}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  #sidebarToggle{display:inline-flex !important}
  .sidebar{
    display:none;position:fixed;top:60px;left:0;right:0;bottom:0;
    background:#080015;z-index:45;padding:20px 16px;
    overflow-y:auto;border-right:0;box-shadow:var(--shadow-lg);
  }
  .sidebar.open{display:flex;flex-direction:column}
  .topbar{padding:10px 16px;gap:10px;flex-wrap:wrap}
  .grid2{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .main{padding:16px 14px}
  .forum-hero{padding:18px 20px}
  .forum-hero-title{font-size:1.4rem}
}
@media (max-width:540px){
  .stats{grid-template-columns:1fr}
  .tg-kb{grid-template-columns:1fr}
  .bar-row{grid-template-columns:120px 1fr 38px}
  .brand small{display:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button type="button" class="btn sm" id="sidebarToggle" aria-label="Открыть меню навигации" title="Меню навигации" style="display:none;margin-right:4px">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="brand"><div class="logo" aria-hidden="true">GM</div><div>Grand Mobile Support Copilot<small>Админ-панель поддержки · ИИ-триаж, Telegram, OCR доказательств, Антифрод</small></div></div>
    <div class="spacer"></div>
    <div class="userbox">
      <label for="userSelect">Пользователь (demo):</label>
      <select id="userSelect" class="select" aria-describedby="demoNotice"></select>
      <span id="roleBadge" class="b b-muted"></span>
    </div>
  </header>
  <div class="demo-strip" id="demoNotice" role="note">
    DEMO MODE: роль выбирается переключателем без аутентификации. Финальное решение всегда остаётся за человеком — никаких автоматических наказаний на основании подозрений ИИ не применяется.
  </div>

  <nav class="sidebar" aria-label="Основное меню" id="sidebar"></nav>

  <main class="main" id="main" tabindex="-1"></main>
</div>

<div class="modal-bg" id="modalBg" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <form class="modal" id="modalForm">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div id="modalErr"></div>
    <div class="actions" style="justify-content:flex-end;margin-top:14px">
      <button type="button" class="btn" id="modalCancel">Отмена</button>
      <button type="submit" class="btn primary" id="modalSubmit">OK</button>
    </div>
  </form>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
/* ===================== Utilities ===================== */
const ICONS = {
  menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
  overview:'<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/>',
  mine:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 12 0v1"/>',
  queue:'<path d="M4 6h16M4 12h16M4 18h10"/>',
  junior:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 20V10"/>',
  senior:'<path d="M12 2l3 6 6 .9-4.5 4.3 1 6.3L12 16.6 6.5 19.5l1-6.3L3 8.9 9 8z"/>',
  assistant:'<path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/><circle cx="12" cy="12" r="3"/>',
  rules:'<path d="M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z"/><path d="M8 8h8M8 12h8"/>',
  analytics:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  audit:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.8 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.8-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 14H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 3V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.8 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21 10h0a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',
  check:'<path d="M5 12l5 5L20 7"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>',
  up:'<path d="M12 19V5M5 12l7-7 7 7"/>', alert:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  refresh:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>', send:'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>',
  save:'<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/>',
  hand:'<path d="M18 11V6a2 2 0 0 0-4 0v5M14 10V4a2 2 0 0 0-4 0v6M10 10.5V6a2 2 0 0 0-4 0v8a8 8 0 0 0 16 0v-3a2 2 0 0 0-4 0"/>',
  ask:'<circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>', lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7A2 2 0 0 1 22 16.9z"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  camera:'<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>'
};
const ic = (n) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||''}</svg>`;
const esc = (s) => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const $ = (sel, root=document) => root.querySelector(sel);
const fmtTime = (iso) => { if(!iso) return '—'; const d=new Date(iso); return d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); };
const LANGS = {ru:'Русский',kk:'Казахский',uz:'Узбекский',en:'Английский',und:'Не определён'};
const PRIO = {critical:'Критический',high:'Высокий',medium:'Средний',low:'Низкий'};
const ACTION_NAMES = {
  ticket_imported:'Импорт тикета', take:'Взял в работу', take_via_telegram:'Принял через Telegram', assign:'Переназначил', retriage:'Перезапустил анализ ИИ',
  save_draft:'Сохранил черновик', request_info:'Запросил данные у игрока', send_reply:'Отправил ответ', escalate:'Передал старшему',
  approve:'Одобрил решение', return:'Вернул на доработку', close:'Закрыл', assistant_saved:'Сохранил результат AI Assistant',
  settings_changed:'Изменил настройки', demo_reset:'Сбросил демо-данные'
};
const prioB = (p) => `<span class="b p-${esc(p)}">${esc(PRIO[p]||p)}</span>`;
const statusB = (s, label) => `<span class="b s-${esc(s)}">${esc(label || (S.meta && S.meta.statuses[s]) || s)}</span>`;
const langB = (l) => `<span class="b b-lang" title="${esc(LANGS[l]||l)}">${esc(l)}</span>`;
const catName = (id) => { const c = S.meta && S.meta.categories.find(x=>x.id===id); return c ? c.name : id; };

const S = { userId: localStorage.getItem('gm_demo_user') || 'junior_1', user:null, users:[], meta:null, selectedId:null, list:{sort:'created_at',order:'desc'}, assistant:{result:null, mode:'text'} };

async function api(method, path, body){
  let res;
  try{
    res = await fetch(path,{method,headers:{'Content-Type':'application/json','X-Demo-User':S.userId},body: body!==undefined?JSON.stringify(body):undefined});
  }catch(e){ const err=new Error('API недоступно: '+e.message); err.status=0; throw err; }
  let data=null; try{ data = await res.json(); }catch(_){}
  if(!res.ok){
    const d = data && data.detail;
    const msg = (d && d.message) || (data && data.message) || (typeof d==='string'?d:'') || ('Ошибка '+res.status);
    const err = new Error(msg); err.status=res.status; err.data=(d && typeof d==='object')?d:data; throw err;
  }
  return data;
}

function toast(msg, type='ok'){
  const el=document.createElement('div');
  el.className='toast '+(type==='ok'?'ok':type);
  const icon = type==='error' ? ic('alert') : (type==='warn' ? ic('alert') : ic('check'));
  el.innerHTML=`<div class="toast-icon">${icon}</div><div class="toast-text">${esc(msg)}</div>`;
  $('#toasts').appendChild(el);
  setTimeout(()=>{
    el.classList.add('toast-exit');
    setTimeout(()=>el.remove(), 250);
  }, type==='error'?6500:3500);
}
function errBox(e){ return `<div class="err" role="alert">${ic('alert')} ${e.status===403?'<b>Доступ запрещён (403).</b> ':''}${esc(e.message)}</div>`; }
const loadingHTML = (t='Загрузка данных…') => `<div class="skeleton-card">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;color:var(--text2)">
    <span class="spinner"></span> <span style="font-weight:600;font-size:0.9rem">${esc(t)}</span>
  </div>
  <div class="skel" style="width:45%;height:18px;margin-bottom:12px"></div>
  <div class="skel" style="width:100%;height:14px;margin-bottom:8px"></div>
  <div class="skel" style="width:85%;height:14px;margin-bottom:8px"></div>
  <div class="skel" style="width:65%;height:14px"></div>
</div>`;
const emptyHTML = (title='Нет данных', desc='По заданным фильтрам или запросу ничего не найдено.', action=null) => `
<div class="empty-state">
  <div class="empty-icon">${ic('queue')}</div>
  <h3>${esc(title)}</h3>
  <p>${esc(desc)}</p>
  ${action ? `<div style="margin-top:14px">${action}</div>` : ''}
</div>`;

async function copyText(text){
  try{ await navigator.clipboard.writeText(text); toast('Ответ скопирован в буфер обмена'); }
  catch(_){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); toast('Ответ скопирован');}catch(e){toast('Не удалось скопировать','error');} ta.remove(); }
}

/* ===================== Modal ===================== */
let modalHandler=null, modalReturnFocus=null;
function openModal({title, body, submit='Подтвердить', kind='primary', onSubmit}){
  modalReturnFocus=document.activeElement;
  $('#modalTitle').textContent=title; $('#modalBody').innerHTML=body; $('#modalErr').innerHTML='';
  const sb=$('#modalSubmit'); sb.textContent=submit; sb.className='btn '+kind; sb.disabled=false;
  modalHandler=onSubmit; $('#modalBg').classList.add('open');
  setTimeout(()=>{ const f=$('#modalBody').querySelector('textarea,input,select'); (f||sb).focus(); },30);
}
function closeModal(){ $('#modalBg').classList.remove('open'); modalHandler=null; if(modalReturnFocus) modalReturnFocus.focus(); }
$('#modalCancel').onclick=closeModal;
$('#modalBg').addEventListener('click',e=>{ if(e.target.id==='modalBg') closeModal(); });
$('#modalForm').addEventListener('submit', async e=>{
  e.preventDefault(); if(!modalHandler) return;
  const sb=$('#modalSubmit'); sb.disabled=true; $('#modalErr').innerHTML='';
  try{ await modalHandler(new FormData($('#modalForm'))); closeModal(); }
  catch(err){ $('#modalErr').innerHTML=errBox(err); sb.disabled=false; }
});

/* ===================== Navigation ===================== */
const NAV = [
  {id:'overview',label:'Обзор Dashboard',icon:'overview'},
  {id:'mine',label:'Мои обращения',icon:'mine',count:'my_open'},
  {id:'queue',label:'Очередь репортов',icon:'queue',count:'queue_unassigned'},
  {id:'junior',label:'Все обращения',icon:'junior'},
  {id:'senior',label:'Старший администратор',icon:'senior',count:'escalations_open',hot:true,senior:true},
  {sep:true},
  {id:'admin-calls',label:'Прямые вызовы админа',icon:'phone',count:'direct_admin_calls_waiting',hot:true},
  {id:'telegram',label:'Telegram-уведомления',icon:'send'},
  {id:'evidence',label:'Анализ доказательств',icon:'camera'},
  {id:'fraud',label:'Антифрод / Фейки',icon:'shield',count:'suspicious_complaints_count',hot:true},
  {id:'offenders',label:'Повторные нарушители',icon:'user',count:'repeat_offenders_count'},
  {sep:true},
  {id:'assistant',label:'AI Admin Assistant',icon:'assistant'},
  {id:'rules',label:'База правил',icon:'rules'},
  {id:'analytics',label:'Аналитика ИИ',icon:'analytics'},
  {id:'audit',label:'История действий',icon:'audit'},
  {id:'settings',label:'Настройки',icon:'settings',seniorOnly:true},
];
let navCounts={};
function renderNav(route){
  const senior = S.user && S.user.role==='senior_admin';
  $('#sidebar').innerHTML = NAV.map(n=>{
    if(n.sep) return '<div class="nav-sep" role="separator"></div>';
    if(n.seniorOnly && !senior) return '';
    let tail='';
    if(n.senior && !senior) tail='<span class="lock" title="Только для старшего администратора">'+ic('lock')+'</span>';
    else if(n.count && navCounts[n.count]!==undefined) tail=`<span class="count ${n.hot&&navCounts[n.count]>0?'hot':''}">${navCounts[n.count]}</span>`;
    return `<a href="#${n.id}" class="nav-link ${route===n.id?'active':''}" ${route===n.id?'aria-current="page"':''}>${ic(n.icon)}<span>${n.label}</span>${tail}</a>`;
  }).join('');
}
async function refreshCounts(){
  try{ navCounts = await api('GET','/api/ws/analytics'); }catch(_){ navCounts={}; }
  renderNav(currentRoute().page);
}
function currentRoute(){ const h=(location.hash||'#overview').slice(1).split('/'); return {page:h[0]||'overview', arg:h[1]?decodeURIComponent(h[1]):null}; }

const PAGES = {};
async function router(){
  const {page,arg}=currentRoute();
  renderNav(page);
  const main=$('#main'); main.innerHTML=loadingHTML();
  const fn = PAGES[page] || PAGES.overview;
  try{ await fn(main,arg); }catch(e){ main.innerHTML=errBox(e); }
}
window.addEventListener('hashchange', router);

/* ===================== Ticket list (shared) ===================== */
const COLS=[['id','ID'],['created_at','Время'],['category','Категория / Подкатегория'],['priority','Приоритет'],['language','Язык'],['status','Статус'],['confidence','Confidence'],['assignee','Назначен'],[null,'Режим ИИ']];

function filtersHTML(opts={}){
  const m=S.meta;
  const f=S.filters||{};
  const opt=(v,l,sel)=>`<option value="${esc(v)}" ${sel?'selected':''}>${esc(l)}</option>`;
  return `<div class="filters" role="search">
    <label class="sr-only" for="fq">Поиск</label>
    <input id="fq" class="input" placeholder="Поиск по ID, нику, игровому ID, тексту… ( / )" value="${esc(f.q||'')}" title="Поиск (нажмите / для быстрого фокуса)" />
    <select id="fstatus" class="select" aria-label="Статус" title="Фильтр по статусу">${opt('','Все статусы',!f.status)}${Object.entries(m.statuses).map(([k,v])=>opt(k,v,f.status===k)).join('')}</select>
    <select id="fcategory" class="select" aria-label="Категория" title="Фильтр по категории">${opt('','Все категории',!f.category)}${m.categories.map(c=>opt(c.id,c.name,f.category===c.id)).join('')}</select>
    <select id="fsubcategory" class="select" aria-label="Подкатегория" title="Фильтр по подкатегории">${opt('','Все подкатегории (DM, PG, Читы…)',!f.subcategory)}${(m.subcategories||[]).map(sc=>opt(sc.id,sc.name,f.subcategory===sc.id)).join('')}</select>
    <select id="fpriority" class="select" aria-label="Приоритет" title="Фильтр по приоритету">${opt('','Все приоритеты',!f.priority)}${m.priorities.map(p=>opt(p,PRIO[p]||p,f.priority===p)).join('')}</select>
    <select id="flanguage" class="select" aria-label="Язык" title="Фильтр по языку">${opt('','Все языки',!f.language)}${m.languages.map(l=>opt(l,l.toUpperCase()+' — '+LANGS[l],f.language===l)).join('')}</select>
    <select id="fhandling" class="select" aria-label="Режим обработки" title="Фильтр по режиму ИИ">${opt('','Все режимы ИИ',!f.handling_mode)}${opt('auto','🤖 Автоматически обработанные ИИ',f.handling_mode==='auto')}${opt('needs_human','👨‍💻 Переданные администрации',f.handling_mode==='needs_human')}${opt('suspicious','⚠️ Подозрительные (Антифрод)',f.handling_mode==='suspicious')}${opt('admin_call','🆘 Прямой вызов админа',f.handling_mode==='admin_call')}</select>
    ${opts.assignee!==false?`<select id="fassignee" class="select" aria-label="Исполнитель" title="Фильтр по исполнителю">${opt('','Все исполнители',!f.assignee)}${opt('none','Не назначен',f.assignee==='none')}${S.users.map(u=>opt(u.id,u.name,f.assignee===u.id)).join('')}</select>`:''}
    <select id="fesc" class="select" aria-label="Эскалация" title="Фильтр по эскалации">${opt('','Эскалация: все',!f.escalated)}${opt('true','Только эскалированные',f.escalated==='true')}${opt('false','Без эскалации',f.escalated==='false')}</select>

function readFilters(){
  const v=id=>{ const el=$('#'+id); return el?el.value:''; };
  const f={q:v('fq'),status:v('fstatus'),category:v('fcategory'),subcategory:v('fsubcategory'),priority:v('fpriority'),language:v('flanguage'),handling_mode:v('fhandling'),assignee:v('fassignee'),escalated:v('fesc')};
  S.filters=f;
  return f;
}
function bindFilters(reload){
  let t; $('#fq').addEventListener('input',()=>{clearTimeout(t); t=setTimeout(reload,220);});
  ['fstatus','fcategory','fsubcategory','fpriority','flanguage','fhandling','fassignee','fesc'].forEach(id=>{ const el=$('#'+id); if(el) el.addEventListener('change',reload); });
  $('#freset').onclick=()=>{ S.filters={}; document.querySelectorAll('.filters input,.filters select').forEach(el=>el.value=''); reload(); };
}

async function fetchList(scope){
  const f=readFilters(); const p=new URLSearchParams({scope,sort:S.list.sort,order:S.list.order});
  Object.entries(f).forEach(([k,v])=>{ if(v) p.set(k,v); });
  return api('GET','/api/ws/tickets?'+p.toString());
}

function bindTable(container, onSelect, reload){
  container.querySelectorAll('th button[data-sort]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.sort; if(S.list.sort===k) S.list.order=S.list.order==='asc'?'desc':'asc'; else { S.list.sort=k; S.list.order=k==='priority'||k==='created_at'||k==='confidence'?'desc':'asc'; }
    reload();
  });
  const rows=[...container.querySelectorAll('tbody tr')];
  rows.forEach((tr,i)=>{
    tr.onclick=()=>onSelect(tr.dataset.id);
    tr.onkeydown=e=>{
      if(e.key==='Enter'||e.key===' '){ e.preventDefault(); onSelect(tr.dataset.id); }
      if(e.key==='ArrowDown'&&rows[i+1]){ e.preventDefault(); rows[i+1].focus(); }
      if(e.key==='ArrowUp'&&rows[i-1]){ e.preventDefault(); rows[i-1].focus(); }
    };
  });
}

function rulesHTML(cited, verification){
  const ver={}; (verification||[]).forEach(v=>ver[v.id]=v);
  const unknown=(verification||[]).filter(v=>v.source==='mentioned_by_player');
  let html='';
  if(!cited||!cited.length){
    html+=`<div class="banner warn"><b>Подходящих пунктов в rules.json не найдено</b>Утверждать нарушение нельзя — требуется проверка человеком. Ссылки на правила не генерируются.</div>`;
  } else {
    html+=cited.map(r=>{ const v=ver[r.id]; const ok=!v||v.exists;
      return `<div class="rule"><div class="rh"><span><span class="rid">п. ${esc(r.id)}</span> <b style="font-size:.86rem">${esc(r.title)}</b></span>
        <span class="${ok?'ver-ok':'ver-bad'}">${ok?ic('check')+' ID найден в rules.json':ic('x')+' ID не найден'}</span></div>
        <q>${esc(r.quote)}</q><div class="pun">Регламент: ${esc(r.punishment||'по решению администрации')} · релевантность ${Math.round((r.relevance_score||0)*100)}%</div></div>`;
    }).join('');
  }
  if(unknown.length){
    html+=`<div class="banner human" style="margin-top:8px"><b>Игрок сослался на несуществующие пункты</b>${unknown.map(u=>`<span class="ver-bad">${ic('x')} п. ${esc(u.id)} — отсутствует в rules.json</span>`).join('<br>')}</div>`;
  }
  return `<div class="stack">${html}</div>`;
}
function historyHTML(h){
  if(!h||!h.length) return '<div class="muted small">История пуста</div>';
  return `<ul class="timeline">${h.slice().reverse().map(e=>`<li><div><b>${esc(e.actor_name)}</b> — ${esc(ACTION_NAMES[e.action]||e.action)}</div>
    <div class="when">${fmtTime(e.ts)}${detailsLine(e.details)}</div></li>`).join('')}</ul>`;
}
function detailsLine(d){
  if(!d) return ''; const parts=[];
  if(d.reason) parts.push('причина: '+d.reason); if(d.comment) parts.push('комментарий: '+d.comment);
  if(d.basis) parts.push('основание: '+d.basis); if(d.decision) parts.push('решение: '+((S.meta&&S.meta.decisions[d.decision])||d.decision));
  if(d.to_name) parts.push('→ '+d.to_name); if(d.rule_ids&&d.rule_ids.length) parts.push('пункты: '+d.rule_ids.join(', '));
  if(d.safety_ok===false) parts.push('⚠ черновик не прошёл фильтр безопасности');
  return parts.length?' · '+esc(parts.join(' · ')):'';
}

async function ticketAction(t, act, afterChange){
  const id=encodeURIComponent(t.id); const draft=()=>($('#draftText')||{}).value||'';
  const tr=t.triage||{};
  const done=async(msg)=>{ toast(msg); await afterChange(); refreshCounts(); };
  try{
    if(act==='copy') return copyText(draft());
    if(act==='tg_notify'){
      const res=await api('POST',`/api/telegram/notify/${id}`);
      toast(`Отправлено в Telegram → назначен ${res.notification.assigned_admin_name}`);
      return;
    }
    if(act==='fb_ok'){

        }
      });

    if(act==='take'){ await api('POST',`/api/ws/tickets/${id}/take`); return done('Обращение взято в работу'); }
    if(act==='retriage'){ await api('POST',`/api/ws/tickets/${id}/triage`); return done('Анализ ИИ перегенерирован'); }
    if(act==='save_draft'){ const r=await api('PUT',`/api/ws/tickets/${id}/draft`,{text:draft()}); toast(r.safety_warnings&&r.safety_warnings.length?'Черновик сохранён, но не пройдёт отправку: '+r.safety_warnings.join(', '):'Черновик сохранён', r.safety_warnings&&r.safety_warnings.length?'warn':'ok'); await afterChange(); return; }
    if(act==='send_reply') return openModal({title:'Отправить ответ игроку',submit:'Отправить',kind:'ok',
      body:`<p class="muted small" style="margin-bottom:8px">Текст пройдёт серверную проверку безопасности. Обращение будет отмечено как решённое.</p><div class="msg admin"><div class="tx">${esc(draft())}</div></div>`,
      onSubmit:async()=>{ await api('POST',`/api/ws/tickets/${id}/send`,{text:draft()}); await done('Ответ отправлен'); }});
    if(act==='request_info') return openModal({title:'Запросить дополнительные данные',submit:'Отправить запрос',
      body:`<div class="field"><label for="m_text">Сообщение игроку</label><textarea id="m_text" name="text" class="textarea" rows="5" required>${esc(INFO_TEMPLATES[(t.triage||{}).language]||INFO_TEMPLATES.ru)}</textarea></div>`,
      onSubmit:async(fd)=>{ await api('POST',`/api/ws/tickets/${id}/request-info`,{text:fd.get('text')}); await done('Запрос данных отправлен'); }});
    if(act==='escalate') return openModal({title:'Передать старшему специалисту',submit:'Эскалировать',kind:'danger',

    if(act==='assign') return openModal({title:'Переназначить обращение',submit:'Назначить',
      body:`<div class="field"><label for="m_user">Исполнитель</label><select id="m_user" name="assignee_id" class="select">${S.users.map(u=>`<option value="${esc(u.id)}" ${u.id===t.assignee?'selected':''}>${esc(u.name)} — ${esc(u.role_label)}</option>`).join('')}</select></div>`,
      onSubmit:async(fd)=>{ await api('POST',`/api/ws/tickets/${id}/assign`,{assignee_id:fd.get('assignee_id')}); await done('Исполнитель назначен'); }});
    if(act==='return') return openModal({title:'Вернуть на доработку',submit:'Вернуть',kind:'warn',
      body:`<div class="field"><label for="m_c">Комментарий исполнителю (обязательно)</label><textarea id="m_c" name="comment" class="textarea" rows="4" required minlength="5"></textarea></div>`,
      onSubmit:async(fd)=>{ await api('POST',`/api/ws/tickets/${id}/review`,{action:'return',comment:fd.get('comment')}); await done('Обращение возвращено на доработку'); }});
    if(act==='close') return openModal({title:'Закрыть обращение',submit:'Закрыть',kind:'danger',
      body:`<div class="field"><label for="m_b">Основание закрытия (обязательно)</label><textarea id="m_b" name="basis" class="textarea" rows="3" required minlength="5"></textarea></div>`,
      onSubmit:async(fd)=>{ await api('POST',`/api/ws/tickets/${id}/review`,{action:'close',basis:fd.get('basis')}); await done('Обращение закрыто'); }});
    if(act==='approve'){
      const cited=(t.triage&&t.triage.cited_rules)||[];
      return openModal({title:'Одобрить итоговое решение',submit:'Зафиксировать решение',kind:'ok',
        body:`<div class="banner warn" style="margin-bottom:12px"><b>ИИ не принимает решений</b>Анализ ИИ — только рекомендация. Подтвердить нарушение можно лишь после личной проверки доказательств; основание и автор решения фиксируются в журнале и истории нарушителя.</div>

        <div class="field"><label for="m_basis">Основание решения (обязательно, от 10 символов)</label><textarea id="m_basis" name="basis" class="textarea" rows="3" required minlength="10"></textarea></div>
        <div class="field"><label>Пункты rules.json, на которых основано решение</label>${cited.length?cited.map(r=>`<label class="check"><input type="checkbox" name="rule_ids" value="${esc(r.id)}"> п. ${esc(r.id)} — ${esc(r.title)}</label>`).join(''):'<div class="small muted">ИИ не нашёл подходящих пунктов.</div>'}
          <input name="extra_rules" class="input" style="width:100%;margin-top:6px" placeholder="Другие пункты через запятую (проверяются на сервере), напр. 7.2"></div>
        <label class="check"><input type="checkbox" name="evidence_verified" value="1"> Я лично проверил доказательства / серверные логи</label>
        <div class="field"><label for="m_ref">Что именно проверено (обязательно для подтверждения нарушения)</label><input id="m_ref" name="evidence_reference" class="input" placeholder="Например: видео от игрока 12:40, логи чата сервера #5"></div>
        <label class="check"><input type="checkbox" name="send_reply" value="1"> Отправить игроку текущий черновик как финальный ответ</label>`,
        onSubmit:async(fd)=>{
          const rule_ids=[...fd.getAll('rule_ids'), ...String(fd.get('extra_rules')||'').split(',').map(s=>s.trim()).filter(Boolean)];
          await api('POST',`/api/ws/tickets/${id}/review`,{action:'approve',decision:fd.get('decision'),basis:fd.get('basis'),
            rule_ids:[...new Set(rule_ids)],evidence_verified:fd.get('evidence_verified')==='1',evidence_reference:fd.get('evidence_reference')||null,
            reply_text:fd.get('send_reply')==='1'?draft():null});
          await done('Решение зафиксировано');
        }});
    }
  }catch(e){ toast(e.message,'error'); }
}

async function loadDetail(container, id, mode, onChanged){
  S.selectedId=id; container.innerHTML=loadingHTML('Загрузка карточки…');
  try{
    const t=await api('GET','/api/ws/tickets/'+encodeURIComponent(id));
    container.innerHTML=ticketDetailHTML(t, mode);
    container.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>ticketAction(t,b.dataset.act,async()=>{ await onChanged(); await loadDetail(container,id,mode,onChanged); }));
  }catch(e){ container.innerHTML=errBox(e); }
}

async function listPage(main, arg, cfg){
  main.innerHTML=`<div class="page-head"><div><h1>${cfg.title}</h1><p>${cfg.subtitle}</p></div>${cfg.headExtra||''}</div>
    ${filtersHTML(cfg.filters||{})}<div class="split"><section id="listBox" aria-label="Список обращений">${loadingHTML()}</section><aside class="detail" id="detailBox" aria-label="Карточка обращения"><div class="card empty">Выберите обращение в списке (клавиши ↑ ↓ и Enter).</div></aside></div>`;
  const listBox=$('#listBox'), detailBox=$('#detailBox');
  const select=(id)=>{ history.replaceState(null,'',`#${cfg.page}/${encodeURIComponent(id)}`); highlight(id); loadDetail(detailBox,id,cfg.mode,reload); };
  const highlight=(id)=>listBox.querySelectorAll('tbody tr').forEach(tr=>{ const on=tr.dataset.id===id; tr.classList.toggle('sel',on); tr.setAttribute('aria-selected',on); });
  async function reload(){
    try{ const d=await fetchList(cfg.scope); listBox.innerHTML=tableHTML(d.tickets, cfg.caption||'Список обращений'); bindTable(listBox, select, reload); highlight(S.selectedId); }
    catch(e){ listBox.innerHTML=errBox(e); }
  }
  bindFilters(reload);
  await reload();
  if(arg) select(arg);
}

PAGES.senior=async(main,arg)=>{
  if(S.user.role!=='senior_admin'){
    try{ await api('GET','/api/ws/tickets?scope=escalations'); }catch(e){
      main.innerHTML=`<div class="page-head"><div><h1>Старший администратор</h1><p>Очередь эскалаций и итоговые решения.</p></div></div>${errBox(e)}
      <p class="muted small" style="margin-top:10px">Ответ получен от backend: доступ к очереди эскалаций есть только у роли senior_admin.</p>`; return;
    }
  }
  main.innerHTML=`<div class="page-head"><div><h1>Старший администратор</h1><p>Сложные и эскалированные обращения. Решение фиксируется с основанием и автором.</p></div></div>
    <div class="tabs" role="tablist"><button class="tab" role="tab" data-tab="esc" aria-selected="true">Очередь эскалаций</button><button class="tab" role="tab" data-tab="jr" aria-selected="false">В работе у младших</button><button class="tab" role="tab" data-tab="crit" aria-selected="false">Критические без решения</button></div>
    <div class="split"><section id="sList" aria-label="Очередь">${loadingHTML()}</section><aside class="detail" id="sDetail" aria-label="Карточка"><div class="card empty">Выберите обращение.</div></aside></div>`;
  let tab='esc';
  const det=$('#sDetail');
  async function reload(){
    const box=$('#sList'); box.innerHTML=loadingHTML();
    try{
      let rows;
      if(tab==='esc') rows=(await api('GET','/api/ws/tickets?scope=escalations&sort=priority')).tickets;
      else if(tab==='jr'){ const juniors=S.users.filter(u=>u.role==='junior_admin').map(u=>u.id);
        rows=(await api('GET','/api/ws/tickets?scope=all&sort=priority')).tickets.filter(r=>juniors.includes(r.assignee)&&!['resolved','closed'].includes(r.status)); }
      else rows=(await api('GET','/api/ws/tickets?scope=all&priority=critical&sort=created_at')).tickets.filter(r=>!['resolved','closed'].includes(r.status));
      if(!rows.length){ box.innerHTML='<div class="card empty">Здесь пусто — нет обращений, требующих решения.</div>'; return; }
      box.innerHTML=`<div class="stack">${rows.map(r=>`<div class="card" tabindex="0" role="button" data-id="${esc(r.id)}" style="cursor:pointer;${r.id===S.selectedId?'border-color:var(--accent)':''}">
        <div class="t-head" style="margin-bottom:4px"><b style="font-family:monospace">${esc(r.id)}</b>${prioB(r.priority)}${statusB(r.status,r.status_label)}${langB(r.language)}<span class="b b-cat">${esc(r.category_name)}</span></div>
        <div class="small muted">${esc(r.snippet)}</div><div class="small" style="margin-top:4px">${ic('user')} ${esc(r.assignee_name||'—')} · ${fmtTime(r.updated_at)}</div></div>`).join('')}</div>`;
      box.querySelectorAll('[data-id]').forEach(c=>{ const go=()=>{ history.replaceState(null,'','#senior/'+encodeURIComponent(c.dataset.id)); loadDetail(det,c.dataset.id,'senior',reload); };
        c.onclick=go; c.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();go();} }; });
    }catch(e){ box.innerHTML=errBox(e); }
  }
  main.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; main.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===b)); reload(); });
  await reload();
  if(arg) loadDetail(det,arg,'senior',reload);
};

          ${prioB(p.risk_level||'low')}
          ${p.is_repeat_offender?'<span class="b p-critical">🔁 Повторный нарушитель</span>':''}
        </div>
        <div class="kv" style="margin-bottom:12px">
          <div><span>✅ Подтверждённые нарушения</span><b style="color:#fca5a5">${p.confirmed_violations}</b></div>
          <div><span>⏳ Неподтверждённые жалобы</span><b style="color:#fcd34d">${p.unconfirmed_complaints||0}</b></div>
          <div><span>❌ Отклонённые жалобы</span><b style="color:#6ee7b7">${p.rejected_complaints||0}</b></div>

        ${(p.repeat_violations&&p.repeat_violations.length)?`<div class="banner warn" style="margin-bottom:10px"><b>Выявленные повторяющиеся нарушения</b>${p.repeat_violations.map(rv=>`• ${esc(rv)}`).join('<br>')}</div>`:''}
        <div class="grid2">
          <div><h3>История подтверждённых наказаний (${(p.punishment_history||[]).length})</h3>
            ${(p.punishment_history&&p.punishment_history.length)?`<ul class="timeline">${p.punishment_history.map(ph=>`<li><b>${esc(ph.type)}</b> (п. ${esc(ph.rule)}) — админ: ${esc(ph.admin)}<div class="when">${esc(ph.date)}</div></li>`).join('')}</ul>`:'<div class="small muted">Подтверждённых наказаний нет.</div>'}

          <div><h3>Неподтверждённые жалобы (не являются доказательством вины)</h3>
            ${(p.unconfirmed_list&&p.unconfirmed_list.length)?`<ul class="timeline">${p.unconfirmed_list.map(u=>`<li>Тикет <b>${esc(u.ticket_id)}</b> · ${esc(u.category)}<div class="when">${esc(u.date||'')} · ${esc(u.note||'На рассмотрении')}</div></li>`).join('')}</ul>`:'<div class="small muted">Неподтверждённых жалоб нет.</div>'}

/* ===================== 9. AI Admin Assistant ===================== */
PAGES.assistant=async(main,arg)=>{
  const tickets=(await api('GET','/api/ws/tickets?scope=all&sort=created_at')).tickets;
  const A=S.assistant; if(arg){ A.mode='ticket'; A.ticketId=arg; }
  main.innerHTML=`<div class="page-head"><div><h1>AI Admin Assistant</h1><p>Краткое содержание жалобы, поиск правил Grand Mobile, анализ доказательств, похожие рассмотренные обращения, рекомендации и генерация ответов на языке игрока (RU/KK/UZ/EN).</p></div></div>
  <div class="split" style="grid-template-columns:minmax(320px,.8fr) minmax(0,1.2fr)">
    <section class="card" aria-label="Входные данные">
      <div class="tabs" role="tablist"><button type="button" class="tab" role="tab" data-mode="text">Вставить текст</button><button type="button" class="tab" role="tab" data-mode="ticket">Открыть тикет</button></div>
      <div id="aText">
        <div class="field"><label for="aKind">Тип обращения</label><select id="aKind" class="select" style="width:100%">
          <option value="complaint">Жалоба</option><option value="question">Вопрос</option><option value="appeal">Обжалование / разбан</option><option value="bug">Технический баг</option></select></div>
        <div class="field"><label for="aInput">Текст репорта игрока (понимает RU/KK/UZ/EN, сленг и опечатки)</label><textarea id="aInput" class="textarea" rows="7" placeholder="Вставьте текст обращения игрока…"></textarea></div>
        <div class="field"><label for="aAtt">Количество вложений (скриншоты/видео)</label><input id="aAtt" type="number" min="0" max="50" value="0" class="input" style="width:120px"></div>
      </div>
      <div id="aTicket" hidden>
        <div class="field"><label for="aTicketSel">Тикет</label><select id="aTicketSel" class="select" style="width:100%">${tickets.map(t=>`<option value="${esc(t.id)}">${esc(t.id)} — ${esc((t.snippet||'').slice(0,60))}</option>`).join('')}</select></div>
        ${tickets.length?'':'<div class="muted small">Нет доступных тикетов.</div>'}
      </div>
      <div class="actions"><button type="button" class="btn primary" id="aRun">${ic('assistant')}Проанализировать</button><button type="button" class="btn" id="aClear">Очистить</button></div>
      <p class="small muted" style="margin-top:10px">Финальное решение всегда остаётся за администратором.</p>
      <div class="card" style="margin-top:14px;background:var(--bg)"><h3>История сохранений</h3><div id="aHist">${loadingHTML()}</div></div>
    </section>
    <section id="aOut" aria-live="polite"><div class="card empty">Результат анализа появится здесь. Вставьте текст репорта или выберите тикет.</div></section>
  </div>`;
  const setMode=(m)=>{ A.mode=m; main.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-selected',b.dataset.mode===m)); $('#aText').hidden=m!=='text'; $('#aTicket').hidden=m!=='ticket'; };
  main.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
  setMode(A.mode); if(A.ticketId && $('#aTicketSel')) $('#aTicketSel').value=A.ticketId;
  if(A.text) $('#aInput').value=A.text;
  $('#aRun').onclick=run; $('#aClear').onclick=()=>{ $('#aInput').value=''; A.result=null; A.text=''; $('#aOut').innerHTML='<div class="card empty">Результат анализа появится здесь.</div>'; };
  $('#aInput').addEventListener('keydown',e=>{ if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)) run(); });
  loadHist();
  if(A.result) renderResult(A.result);

  async function loadHist(){
    try{ const d=await api('GET','/api/ws/audit?action=assistant_saved&limit=8');
      $('#aHist').innerHTML=d.entries.length?`<ul class="timeline">${d.entries.map(e=>`<li><a href="#junior/${encodeURIComponent(e.ticket_id)}">${esc(e.ticket_id)}</a> — ${esc(e.actor_name)}<div class="when">${fmtTime(e.ts)} · ${e.details.mode==='new_ticket'?'новый тикет':'обновление тикета'}</div></li>`).join('')}</ul>`:'<div class="muted small">Пока ничего не сохранено.</div>';
    }catch(e){ $('#aHist').innerHTML=errBox(e); }
  }
  async function run(){
    const out=$('#aOut'); const body={kind:$('#aKind').value, attachments:parseInt($('#aAtt').value||'0',10)};
    if(A.mode==='ticket'){ body.ticket_id=$('#aTicketSel').value; if(!body.ticket_id){ toast('Выберите тикет','warn'); return; } }
    else { body.text=$('#aInput').value.trim(); A.text=body.text; if(!body.text){ out.innerHTML='<div class="card empty">Нет текста для анализа — вставьте текст репорта.</div>'; $('#aInput').focus(); return; } }
    $('#aRun').disabled=true;
    out.innerHTML=`<div class="card"><div class="muted"><span class="spinner"></span> Анализ: язык, классификация, поиск в rules.json…</div><div class="skel" style="width:70%"></div><div class="skel"></div><div class="skel" style="width:85%"></div></div>`;
    try{ A.result=await api('POST','/api/ws/assistant/analyze',body); A.input=body; renderResult(A.result); }
    catch(e){ out.innerHTML=`${errBox(e)}<div class="actions" style="margin-top:10px"><button class="btn" id="aRetry">${ic('refresh')}Повторить</button></div>`; $('#aRetry').onclick=run; }
    finally{ $('#aRun').disabled=false; }
  }
  function renderResult(r){
    const tr=r.triage, f=tr.facts||{}, cop=tr.ai_summary||{};
    const unknownVer=(r.rule_verification||[]);
    const similarResolved = cop.similar_resolved_cases || [];
    const decRecs = cop.decision_recommendations || [];
    $('#aOut').innerHTML=`<div class="stack">
      <div class="card"><h3>Классификация и Confidence Score</h3><div class="t-head">${langB(tr.language)}<span class="b b-cat">${esc(tr.category_name||tr.category)}</span>
        ${tr.subcategory_name?`<span class="b b-subcat">${esc(tr.subcategory_name)}</span>`:''}
        ${prioB(tr.priority)}
        <span class="b ${tr.needs_human?'b-human':'b-auto'}">${tr.needs_human?'Передано администрации':'Авто-обработка ИИ'}</span>
        <span class="b b-muted">Confidence: ${tr.confidence_pct||Math.round((tr.confidence||0)*100)}%</span></div>
        <div class="msg" style="margin-top:8px"><div class="tx small">${esc(cop.summary||'')}</div></div>
      </div>
      ${humanBanner(tr)}
      ${decRecs.length?`<div class="card"><h3>Рекомендации по возможным решениям (финальное решение за администратором)</h3>
        <div class="stack">${decRecs.map(dr=>`<div class="msg"><b class="small">${esc(dr.label)}</b><div class="small muted">${esc(dr.reason)}</div></div>`).join('')}</div>
      </div>`:''}
      ${similarResolved.length?`<div class="card"><h3>Похожие рассмотренные обращения (${similarResolved.length})</h3>
        <div class="stack">${similarResolved.map(sc=>`<div class="msg"><div class="meta"><span>Прецедент ${esc(sc.case_id)} · п. ${esc(sc.rule_id)}</span><span>сходство ${sc.similarity_pct}%</span></div><div class="small"><b>${esc(sc.title)}</b><br>${esc(sc.resolution)}</div></div>`).join('')}</div>
      </div>`:''}
      <div class="card"><h3>Найденные пункты rules.json и проверка ID <span class="b b-cat">${(tr.cited_rules||[]).length}</span></h3>${rulesHTML(tr.cited_rules, unknownVer)}</div>
      <div class="card"><h3>Извлечённые факты</h3>${factsHTML(f)}</div>
      <div class="card"><h3>Черновик ответа на языке игрока (${esc(tr.language)})</h3>
        <label class="sr-only" for="aDraft">Черновик</label><textarea id="aDraft" class="textarea" rows="6">${esc(tr.draft_response)}</textarea>
        <div class="actions" style="margin-top:10px"><button class="btn primary" id="aCopy">${ic('copy')}Скопировать ответ</button>
          <button class="btn" id="aRegen">${ic('refresh')}Перегенерировать</button>
          <button class="btn ok" id="aSave">${ic('save')}${r.ticket_id?'Сохранить в тикет '+esc(r.ticket_id):'Сохранить как новый тикет'}</button>
          ${r.ticket_id?`<a class="btn" href="#junior/${encodeURIComponent(r.ticket_id)}">Открыть карточку</a>`:''}</div>
      </div>
      <div class="card"><h3>Обоснование классификации (reasons)</h3><ul class="reasons">${(tr.reasons||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
    </div>`;
    $('#aCopy').onclick=()=>copyText($('#aDraft').value);
    $('#aRegen').onclick=run;
    $('#aSave').onclick=async()=>{
      const b=$('#aSave'); b.disabled=true;
      try{
        const body=r.ticket_id?{ticket_id:r.ticket_id,draft:$('#aDraft').value}:{text:A.input.text,kind:A.input.kind,attachments:A.input.attachments,draft:$('#aDraft').value};
        const t=await api('POST','/api/ws/assistant/save',body);
        toast('Сохранено: '+t.id); r.ticket_id=t.id; loadHist(); refreshCounts();
        b.outerHTML=`<a class="btn ok" href="#junior/${encodeURIComponent(t.id)}">${ic('check')}Сохранено — открыть ${esc(t.id)}</a>`;
      }catch(e){ toast(e.message,'error'); b.disabled=false; }
    };
  }
};

PAGES.rules=async(main)=>{
  const d=await api('GET','/api/ws/rules');
  main.innerHTML=`<div class="page-head"><div><h1>База правил Grand Mobile</h1><p>Источник: ${esc(d.source)} · ${d.count} пунктов · только чтение.</p></div></div>
    <div class="filters"><input id="rq" class="input" placeholder="Поиск по ID, заголовку, тексту… ( / )"><select id="rc" class="select" aria-label="Категория"><option value="">Все категории</option>${S.meta.categories.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select></div>

};

/* ===================== Analytics ===================== */
PAGES.analytics=async(main)=>{

  const bars=(obj,labelFn)=>{ const total=Object.values(obj||{}).reduce((s,v)=>s+v,0)||1;
    return Object.entries(obj||{}).sort((x,y)=>y[1]-x[1]).map(([k,v])=>`<div class="bar-row"><span class="nm" title="${esc(labelFn(k))}">${esc(labelFn(k))}</span><div class="tr"><div class="fl" style="width:${Math.max(3,v/total*100)}%"></div></div><b>${v}</b></div>`).join('')||'<div class="muted small">Нет данных</div>'; };
  main.innerHTML=`<div class="page-head"><div><h1>Аналитика эффективности ИИ</h1><p>${a.visible_total} обращений · Мониторинг точности классификации, скорости триажа и Feedback Loop</p></div></div>
    <div class="stats">
      <div class="stat ok"><div class="v">${eff.avg_confidence_pct||0}%</div><div class="l">Средний Confidence Score</div></div>
      <div class="stat ok"><div class="v">${eff.auto_handled_rate_pct||0}%</div><div class="l">Авто-обработано ИИ</div></div>
      <div class="stat"><div class="v">${fb.ai_accuracy_pct!=null?fb.ai_accuracy_pct:100}%</div><div class="l">Точность по Feedback Loop (${fb.total_feedback||0})</div></div>
      <div class="stat"><div class="v">${a.processing.avg_processing_time_ms} / ${a.processing.p95_processing_time_ms}</div><div class="l">Среднее / p95 время, мс</div></div>
      <div class="stat"><div class="v">$${Number(a.processing.avg_cost_usd||0).toFixed(4)}</div><div class="l">Средняя стоимость</div></div>
    </div>
    <div class="grid2">
      <div class="card"><h2>По статусам</h2>${bars(a.by_status,k=>S.meta.statuses[k]||k)}</div>
      <div class="card"><h2>По приоритетам</h2>${bars(a.by_priority,k=>PRIO[k]||k)}</div>
      <div class="card"><h2>По категориям</h2>${bars(a.by_category,catName)}</div>
      <div class="card"><h2>По подкатегориям нарушений</h2>${bars(a.by_subcategory,k=>k)}</div>
    </div>
    ${a.team?`<div class="table-wrap" style="margin-top:14px"><table><caption>Команда администраторов</caption><thead><tr><th scope="col"><span class="th">Сотрудник</span></th><th scope="col"><span class="th">Роль</span></th><th scope="col"><span class="th">Открытые</span></th><th scope="col"><span class="th">Завершённые</span></th><th scope="col"><span class="th">Эскалаций</span></th><th scope="col"><span class="th">Действий</span></th></tr></thead>
      <tbody>${a.team.map(u=>`<tr><td>${esc(u.name)}</td><td class="small">${u.role==='senior_admin'?'Старший':'Младший'}</td><td>${u.open}</td><td>${u.resolved}</td><td>${u.escalated_by}</td><td>${u.actions}</td></tr>`).join('')}</tbody></table></div>`
      :'<p class="muted small" style="margin-top:12px">Командная аналитика доступна только старшему администратору.</p>'}`;
};

PAGES.audit=async(main)=>{
  const senior=S.user.role==='senior_admin';
  main.innerHTML=`<div class="page-head"><div><h1>История действий</h1><p>${senior?'Аудит действий всей команды.':'Ваши действия (журнал команды доступен старшему).'}</p></div></div>
    <div class="filters"><select id="auA" class="select" aria-label="Действие"><option value="">Все действия</option>${Object.entries(ACTION_NAMES).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join('')}</select>
    ${senior?`<select id="auU" class="select" aria-label="Сотрудник"><option value="">Все сотрудники</option>${S.users.map(u=>`<option value="${esc(u.id)}">${esc(u.name)}</option>`).join('')}</select>`:''}</div><div id="auBox">${loadingHTML()}</div>`;
  const load=async()=>{
    const p=new URLSearchParams({limit:'300'}); if($('#auA').value) p.set('action',$('#auA').value); if(senior&&$('#auU').value) p.set('actor',$('#auU').value);
    try{ const d=await api('GET','/api/ws/audit?'+p);
      $('#auBox').innerHTML=d.entries.length?`<div class="table-wrap"><table><caption>Записей: ${d.count}</caption><thead><tr><th scope="col"><span class="th">Время</span></th><th scope="col"><span class="th">Автор</span></th><th scope="col"><span class="th">Действие</span></th><th scope="col"><span class="th">Тикет</span></th><th scope="col"><span class="th">Детали</span></th></tr></thead>
        <tbody>${d.entries.map(e=>`<tr><td class="small">${fmtTime(e.ts)}</td><td>${esc(e.actor_name)} <span class="small muted">${e.actor_role==='senior_admin'?'старший':(e.actor_role==='junior_admin'?'младший':'')}</span></td><td>${esc(ACTION_NAMES[e.action]||e.action)}</td>
          <td class="id">${e.ticket_id?`<a href="#junior/${encodeURIComponent(e.ticket_id)}">${esc(e.ticket_id)}</a>`:'—'}</td><td class="small muted">${detailsLine(e.details).replace(/^ · /,'')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="card empty">Записей нет.</div>';
    }catch(e){ $('#auBox').innerHTML=errBox(e); }
  };
  $('#auA').onchange=load; if($('#auU')) $('#auU').onchange=load; await load();
};

/* ===================== Settings ===================== */
PAGES.settings=async(main)=>{
  let d;
  try{ d=await api('GET','/api/ws/settings'); }
  catch(e){ main.innerHTML=`<div class="page-head"><div><h1>Настройки</h1></div></div>${errBox(e)}`; return; }
  const tgSt = d.system.telegram_status || {};
  main.innerHTML=`<div class="page-head"><div><h1>Настройки</h1><p>Доступно только старшему администратору (проверяется на backend).</p></div></div>
  <div class="grid2"><form class="card" id="setForm"><h2>Политики очереди</h2>
    <label class="check"><input type="checkbox" name="junior_can_view_unassigned" ${d.settings.junior_can_view_unassigned?'checked':''}> Младшие видят общую очередь без исполнителя</label>
    <label class="check"><input type="checkbox" name="junior_can_send_without_review" ${d.settings.junior_can_send_without_review?'checked':''}> Младшие могут отправлять ответы без проверки, если ИИ не требует человека</label>
    <label class="check"><input type="checkbox" checked disabled> Подтверждение наказания требует проверки доказательств человеком (не отключается)</label>
    <div class="actions" style="margin-top:10px"><button class="btn primary" type="submit">${ic('save')}Сохранить</button></div></form>
  <div class="card"><h2>Система и внешние интеграции</h2><div class="kv">
    <div><span>Режим</span><b>${d.system.demo_mode?'DEMO (без аутентификации)':'production'}</b></div>
    <div><span>LLM</span><b>${d.system.llm_enabled?'включена: '+esc(d.system.llm_model):'выключена (локальный генератор, $0)'}</b></div>
    <div><span>Источник правил</span><b>${esc(d.system.rules_source)} · ${d.system.rules_count} пунктов</b></div>
    <div><span>Telegram Bot</span><b>${tgSt.live_bot_configured?'✅ Live Bot API подключён':'📦 Локальный outbox (.env)'}</b></div>
    <div><span>Chat ID администраторов</span><b>${tgSt.chat_id_configured?'Настроен':'Не задан (TELEGRAM_ADMIN_CHAT_ID)'}</b></div>
    <div><span>Игровой API Grand Mobile</span><b>${d.system.grand_mobile_api_status&&d.system.grand_mobile_api_status.configured?'Подключён':'Демо-слой с поддержкой моста'}</b></div></div>
    <div class="actions" style="margin-top:12px;gap:8px;flex-wrap:wrap">
      <button class="btn" type="button" id="setTgTest">🔌 Проверить связь с Telegram</button>
      <button class="btn ok" type="button" id="setTgSend">✉️ Отправить тест в Telegram</button>
      <button class="btn danger" type="button" id="resetDemo">${ic('refresh')}Сбросить демо-данные</button>
    </div></div></div>`;
  $('#setForm').onsubmit=async e=>{ e.preventDefault(); const fd=new FormData(e.target);
    try{ await api('PUT','/api/ws/settings',{junior_can_view_unassigned:fd.get('junior_can_view_unassigned')==='on',junior_can_send_without_review:fd.get('junior_can_send_without_review')==='on'}); toast('Настройки сохранены'); }
    catch(err){ toast(err.message,'error'); } };
  $('#setTgTest').onclick=async()=>{
    try{
      const res=await api('POST','/api/telegram/test-connection');
      if(res.ok){ toast(`✅ Бот подключён: @${res.bot_username} (${res.bot_name})`,'ok'); }
      else { toast(`⚠️ Статус бота: ${res.error||res.status}`,'warn'); }
      PAGES.settings(main);
    }catch(err){ toast(err.message,'error'); }
  };
  $('#setTgSend').onclick=async()=>{
    try{
      const res=await api('POST','/api/telegram/test-send',{text:'Тестовое уведомление из настроек Grand Mobile AI Support'});
      toast(`Тест отправлен: ${res.delivery_mode} (${res.status})`,res.ok?'ok':'warn');
      PAGES.settings(main);
    }catch(err){ toast(err.message,'error'); }
  };
  $('#resetDemo').onclick=()=>openModal({title:'Сбросить демо-данные?',submit:'Сбросить',kind:'danger',body:'<p>Все тикеты, черновики и журнал будут пересозданы из исходного набора данных.</p>',
    onSubmit:async()=>{ await api('POST','/api/ws/demo/reset'); toast('Демо-данные сброшены'); refreshCounts(); }});
};

/* ===================== Boot ===================== */
async function loadIdentity(){
  S.user=await api('GET','/api/ws/me');
  $('#roleBadge').textContent=S.user.role_label;
  $('#roleBadge').className='b '+(S.user.role==='senior_admin'?'p-critical':'b-lang');
}
async function boot(){
  const sToggle = $('#sidebarToggle');
  if(sToggle) sToggle.onclick=()=>$('#sidebar').classList.toggle('open');
  try{
    S.users=await fetch('/api/ws/users',{headers:{'X-Demo-User':S.userId}}).then(r=>r.ok?r.json():Promise.reject(new Error('users')));
  }catch(_){ S.userId='junior_1'; localStorage.setItem('gm_demo_user','junior_1'); S.users=await api('GET','/api/ws/users'); }
  $('#userSelect').innerHTML=S.users.map(u=>`<option value="${esc(u.id)}" ${u.id===S.userId?'selected':''}>${esc(u.name)} — ${esc(u.role_label)}</option>`).join('');
  $('#userSelect').onchange=async e=>{ S.userId=e.target.value; localStorage.setItem('gm_demo_user',S.userId); S.selectedId=null; S.assistant={result:null,mode:'text'};
    await loadIdentity(); toast('Демо-роль: '+S.user.role_label,'warn'); await refreshCounts(); location.hash='#overview'; router(); };
  S.meta=await api('GET','/api/ws/meta');
  await loadIdentity();
  await refreshCounts();
  router();
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && $('#modalBg').classList.contains('open')) closeModal();
  if(e.key==='/' && !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){ const s=$('#fq')||$('#rq')||$('#aInput')||$('#offQ'); if(s){ e.preventDefault(); s.focus(); } }
});
boot().catch(e=>{ $('#main').innerHTML=errBox(e); });
</script>
</body>
